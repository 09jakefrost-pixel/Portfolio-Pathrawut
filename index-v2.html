<style>
:root{--bg:#05070b;--ink:#f4f6fb;--mut:#98a2b3;--line:rgba(255,255,255,.13);--acc:#6ea8ff;--acc2:#a78bfa;--f:-apple-system,"SF Pro Display",Inter,system-ui,sans-serif;box-sizing:border-box;color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*:before,*:after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 90px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 var(--f);overflow-x:hidden;-webkit-font-smoothing:antialiased}
body:before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
.orb{position:fixed;border-radius:50%;filter:blur(90px);opacity:.5;z-index:-1;animation:fl 18s ease-in-out infinite alternate}
.o1{width:520px;height:520px;background:#2563eb;top:-120px;left:-120px}
.o2{width:480px;height:480px;background:#7c3aed;bottom:-140px;right:-100px;animation-delay:-6s}
@keyframes fl{to{transform:translate(70px,50px) scale(1.15)}}
@keyframes up{from{opacity:0;transform:translateY(14px);filter:blur(6px)}}
.glass{background:linear-gradient(145deg,rgba(255,255,255,.10),rgba(255,255,255,.03));border:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 20px 50px -24px rgba(0,0,0,.7);-webkit-backdrop-filter:blur(22px) saturate(160%);backdrop-filter:blur(22px) saturate(160%);border-radius:22px}
.wrap{max-width:1100px;margin:0 auto;padding:0 20px}
.nav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:40;width:calc(100% - 24px);max-width:1100px;margin:10px auto 0;display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:999px}
.br{display:flex;align-items:center;gap:9px;color:var(--ink);text-decoration:none;font-weight:600}
.lg{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:700;color:#06101f;background:linear-gradient(135deg,var(--acc),var(--acc2))}
.lk{display:flex;gap:2px;margin-left:12px}.lk a{color:var(--mut);text-decoration:none;font-size:.88rem;padding:6px 12px;border-radius:99px;transition:.25s}.lk a:hover{color:var(--ink);background:rgba(255,255,255,.07)}
.sp{flex:1}
.seg{position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border-radius:99px;background:rgba(255,255,255,.06);border:1px solid var(--line);padding:3px}
.seg>i{position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);border-radius:99px;background:linear-gradient(135deg,var(--acc),var(--acc2));transition:transform .5s cubic-bezier(.3,1.35,.5,1)}
.seg[data-v="1"]>i{transform:translateX(100%)}
.seg button{position:relative;z-index:1;border:0;background:none;color:var(--mut);font:600 .8rem var(--f);padding:7px 14px;border-radius:99px;cursor:pointer;transition:color .3s;white-space:nowrap}
.seg button.on{color:#06101f}.s{display:none}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.btn{display:inline-flex;align-items:center;gap:7px;border:0;cursor:pointer;text-decoration:none;font:600 .9rem var(--f);color:#06101f;background:linear-gradient(135deg,var(--acc),var(--acc2));padding:10px 18px;border-radius:99px;box-shadow:0 8px 30px -8px rgba(110,168,255,.7);transition:transform .25s}
.btn:hover{transform:translateY(-2px)}.btn.g{background:rgba(255,255,255,.07);color:var(--ink);border:1px solid var(--line);box-shadow:none}.btn.wa{background:linear-gradient(135deg,#34d399,#22c55e);box-shadow:0 8px 30px -8px rgba(52,211,153,.6)}.btn[hidden]{display:none}
.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:40px;align-items:center;padding:56px 20px 40px}
.re{animation:up .7s backwards}
.eye{display:inline-flex;gap:9px;align-items:center;padding:6px 14px;border-radius:99px;font-size:.82rem;color:var(--mut);animation:up .7s backwards}
.pulse{width:8px;height:8px;border-radius:50%;background:#34d399;animation:pl 2s infinite}
@keyframes pl{0%{box-shadow:0 0 0 0 rgba(52,211,153,.6)}70%,100%{box-shadow:0 0 0 9px transparent}}
h1{font-size:clamp(2.6rem,7vw,4.8rem);line-height:1.02;letter-spacing:-.04em;margin:.3em 0 .15em;font-weight:700;animation:up .8s .1s backwards}
.grad{background:linear-gradient(120deg,#fff 30%,var(--acc) 70%,var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.role{font-size:clamp(1.3rem,3vw,1.9rem);font-weight:600;color:var(--acc);margin:.2em 0 .4em;letter-spacing:-.02em}
.tg{font-size:1.1rem;color:var(--ink);margin:0 0 .6em;max-width:34em}.sm{color:var(--mut);margin:0;max-width:36em}
.row{display:flex;flex-wrap:wrap;gap:12px;margin:24px 0 0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-top:28px}
.stat{padding:16px;border-radius:18px}.stat b{display:block;font-size:1.45rem;letter-spacing:-.02em;line-height:1.2}.stat span{font-size:.76rem;color:var(--mut);line-height:1.3;display:block;margin-top:4px}
.sw>*{animation:up .6s calc(var(--i)*70ms) backwards}
.ph{position:relative;width:min(340px,78vw);aspect-ratio:4/5;padding:8px;justify-self:center;animation:up .9s .2s backwards}
.ph:before{content:"";position:absolute;inset:-2px;border-radius:32px;background:conic-gradient(from 0deg,var(--acc),var(--acc2),transparent 40%,var(--acc));z-index:-1;filter:blur(20px);opacity:.5;animation:sp 12s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.ph img{width:100%;height:100%;object-fit:cover;object-position:top;border-radius:24px;display:block}
.ph .tag{position:absolute;left:18px;right:18px;bottom:18px;padding:10px 14px;border-radius:16px;font-size:.78rem;line-height:1.35;color:#dbe4f3}.tag b{color:#fff;font-size:.84rem}
.sec{padding:56px 20px}.sec h2{font-size:clamp(1.7rem,3.5vw,2.4rem);letter-spacing:-.03em;margin:0 0 6px;line-height:1.15}.sub{color:var(--mut);margin:0 0 28px}
.card{padding:22px 24px;margin-bottom:16px;transition:border-color .3s}.card:hover{border-color:rgba(110,168,255,.45)}

.tl{position:relative;padding-left:34px}.tl:before{content:"";position:absolute;left:11px;top:8px;bottom:24px;width:2px;background:linear-gradient(var(--acc),var(--acc2),transparent)}
.ti{position:relative}

.meta{display:flex;flex-wrap:wrap;gap:2px 16px;color:var(--mut);font-size:.85rem;margin-top:2px}

.pipe{display:grid;grid-template-columns:repeat(5,1fr);position:relative;margin-top:10px}.pipe:before{content:"";position:absolute;top:6px;left:10%;right:10%;height:2px;background:linear-gradient(90deg,var(--acc),var(--acc2));opacity:.6}
.st{position:relative;text-align:center;font-size:.74rem;color:#dbe4f3;line-height:1.3;padding:0 2px}.st:before{content:"";display:block;width:14px;height:14px;margin:0 auto 8px;border-radius:50%;background:var(--bg);border:2px solid var(--acc)}

.modal{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(2,4,8,.6);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}.modal.open{display:flex}
.mb{position:relative;width:min(520px,100%);max-height:92vh;overflow:auto;padding:26px;animation:up .45s backwards;background:rgba(18,22,32,.88)}
.x{position:absolute;top:14px;right:16px;border:0;background:rgba(255,255,255,.08);color:var(--ink);width:32px;height:32px;border-radius:50%;font-size:1.2rem;cursor:pointer}
.mb h3{margin:0 0 4px;font-size:1.3rem}label{display:block;font-size:.78rem;color:var(--mut);margin:14px 0 6px}
input,select{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--ink);font:inherit}select option{color:#111}
.opts{display:flex;flex-wrap:wrap;gap:8px}.opt{padding:8px 14px;border-radius:99px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--ink);font:500 .82rem var(--f);cursor:pointer;transition:.2s}.opt.on{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#06101f;border-color:transparent}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.slots .opt{padding:8px 0;text-align:center}
.er{color:#ff9a9a;font-size:.85rem;margin:10px 0 0}.nt{color:#fde68a;font-size:.8rem;margin:6px 0 0}.w{width:100%;margin-top:22px;padding:13px;justify-content:center}
.sum{padding:14px 16px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid var(--line);font-size:.88rem;line-height:1.55;white-space:pre-line;max-height:260px;overflow:auto;margin:14px 0}
